[project]
name = "dam-outlook"
version = "0.0.0"
description = "Outlook and verification for Fukuoka City dam storage"
requires-python = ">=3.12"
dependencies = ["pypdf>=6.21.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
